# Put this file at .github/workflows/build.yml in your fork of ColdGrub1384/Pyto.
# Revision 3: download and verify all command frameworks before compiling.
# All eight official archives checked locally; full macOS build not yet verified.
name: Build Pyto for TrollStore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyto-trollstore
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      COCOAPODS_DISABLE_STATS: "true"

    steps:
      - name: Checkout your Pyto fork
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Prepare build environment
        run: |
          mkdir -p output
          test -f Pyto.xcodeproj/project.pbxproj
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          python3 --version
          pod --version
          git rev-parse HEAD > output/source-commit.txt
          cat > "$RUNNER_TEMP/pyto-constraints.txt" <<'EOF'
          Cython==0.29.36
          numpy==1.23.5
          setuptools==59.8.0
          wheel==0.41.3
          pip==23.3.2
          sphinx==5.3.0
          sphinx-rtd-theme==1.3.0
          EOF
          export PIP_CONSTRAINT="$RUNNER_TEMP/pyto-constraints.txt"
          echo "PIP_CONSTRAINT=$PIP_CONSTRAINT" >> "$GITHUB_ENV"
          python3 -m pip install pip setuptools wheel Cython numpy
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.gitmodules')
          p.write_text(p.read_text().replace('http://github.com/', 'https://github.com/'))
          source = Path('Pyto/Model/SceneDelegate.swift').read_text()
          if '#if VPP || SCREENSHOTS' not in source:
              raise SystemExit('Expected VPP branch not found. The source layout has changed.')
          setup = Path('setup.sh')
          setup_text = setup.read_text().replace(
              'tar -xzvf Python-3.10-iOS-support.b1.tar.gz',
              'tar -xzvf ../Python-3.10-iOS-support.b1.tar.gz')
          # The workflow prepares the complete framework set before setup.sh.
          # Remove its unchecked, duplicate downloads so it cannot overwrite them.
          start = setup_text.find('# ios_system\n')
          end = setup_text.find('pushd Extensions/Dependencies/libssh2', start)
          if start < 0 or end < start:
              raise SystemExit('Expected ios_system download section not found.')
          setup_text = (setup_text[:start]
                        + '# ios_system frameworks are prepared by the workflow.\n\n'
                        + setup_text[end:])
          # Stop promptly if any remaining top-level download/unpack fails.
          lines = []
          for line in setup_text.splitlines():
              if line.startswith('curl '):
                  line = line.replace('curl ', 'curl --fail --retry 3 --retry-delay 2 --connect-timeout 30 ', 1) + ' || exit 1'
              elif line.startswith('unzip '):
                  line = line.replace('unzip ', 'unzip -q -o ', 1) + ' || exit 1'
              elif line.startswith('tar -xzvf ') or line == 'pod install':
                  line += ' || exit 1'
              lines.append(line)
          setup.write_text('\n'.join(lines) + '\n')
          # The scientific libraries are still built. Rebuilding their offline
          # manuals installs a large documentation/TeX toolchain; skip that part.
          docs = Path('Extensions/Dependencies/tools/build-docs.sh')
          if not docs.is_file():
              raise SystemExit('Expected documentation build script not found.')
          docs.write_text('#!/bin/bash\necho "Skipping third-party offline manual generation"\n')
          PY

      - name: Fetch source dependencies
        run: |
          set -o pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4 2>&1 | tee output/submodules.log
          git submodule status --recursive >> output/source-commit.txt

      - name: Download and verify all command frameworks
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/pyto-command-frameworks.py" <<'PY'
          import hashlib
          import os
          import plistlib
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          base = Path(os.environ['GITHUB_WORKSPACE']) / 'Extensions/Dependencies/ios_system'
          archives = Path(os.environ['RUNNER_TEMP']) / 'pyto-framework-archives'
          hashes = {
              'awk': 'd0ac9d6d98b8129c8b392a337c7d5e8289cdbdf9be3d5e6a5376891489c520a1',
              'curl_ios': '8281e5b74ce6c4f6132415172cc806d097ba283048eb0882d14e1485ec49dade',
              'files': '8296849e51ee9ddbb3796a1a87bb3a411cfdabd827d48bd5713fbfb3333d9862',
              'shell': '846651a205e9d781f1f71d3124b5cfca3edfa7722a6c11977ab9c6c73049a810',
              'tar': 'f5769e81aa15730cc041a7d95a8a8b549888633b2649b4f0adc20b437c25fb4d',
              'text': 'bd594ed4bbc67cf9c9393e360a35a35dd9674a4be0d460622221935ea7c76eb2',
              'network_ios': '18e96112ae86ec39390487d850e7732d88e446f9f233b2792d633933d4606d46',
              'ssh_cmd': '9b57b07d4e552f30f7127843860defe4e8edbad8c0b5f2e4c7e99399713b87e6',
          }

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None

          def validate(name):
              framework = base / (name + '.xcframework')
              with (framework / 'Info.plist').open('rb') as handle:
                  info = plistlib.load(handle)
              candidates = [item for item in info['AvailableLibraries']
                            if item['SupportedPlatform'] == 'ios'
                            and not item.get('SupportedPlatformVariant')
                            and 'arm64' in item['SupportedArchitectures']]
              if not candidates:
                  raise ValueError(f'No iPhone arm64 slice in {framework}')
              item = candidates[0]
              bundle = framework / item['LibraryIdentifier'] / item['LibraryPath']
              with (bundle / 'Info.plist').open('rb') as handle:
                  bundle_info = plistlib.load(handle)
              binary = bundle / bundle_info['CFBundleExecutable']
              if not binary.is_file() or binary.stat().st_size == 0:
                  raise ValueError(f'Missing or empty framework binary: {binary}')

          if '--check' not in sys.argv:
              base.mkdir(parents=True, exist_ok=True)
              archives.mkdir(parents=True, exist_ok=True)
              for name, expected in hashes.items():
                  archive = archives / (name + '.xcframework.zip')
                  release = ('https://github.com/holzschu/network_ios/releases/download/v0.2/'
                             if name == 'network_ios' else
                             'https://github.com/holzschu/ios_system/releases/download/v3.0.0/')
                  url = release + archive.name
                  for attempt in range(1, 4):
                      try:
                          if digest(archive) != expected:
                              partial = archive.with_suffix('.zip.part')
                              print(f'Downloading {name}, attempt {attempt}/3', flush=True)
                              subprocess.run(['curl', '--fail', '--location', '--retry', '2',
                                              '--retry-delay', '2', '--connect-timeout', '30',
                                              '--max-time', '300', '--output', str(partial), url], check=True)
                              if digest(partial) != expected:
                                  raise ValueError(f'SHA256 mismatch for {name}')
                              partial.replace(archive)
                          with zipfile.ZipFile(archive) as package:
                              corrupt = package.testzip()
                              if corrupt:
                                  raise ValueError(f'Corrupt archive entry: {corrupt}')
                          subprocess.run(['unzip', '-q', '-o', str(archive), '-d', str(base)], check=True)
                          validate(name)
                          print(f'Installed and verified: {name} (iPhone arm64)', flush=True)
                          break
                      except (OSError, ValueError, zipfile.BadZipFile, subprocess.CalledProcessError) as error:
                          print(f'{name}: {error}', file=sys.stderr, flush=True)
                          archive.unlink(missing_ok=True)
                          if attempt == 3:
                              raise SystemExit(f'Cannot prepare {name}; stopping before dependency compilation.')

          failures = []
          for name in hashes:
              try:
                  validate(name)
                  print(f'OK: {name} (iPhone arm64)', flush=True)
              except (OSError, ValueError, KeyError) as error:
                  failures.append(f'{name}: {error}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
          python3 -u "$RUNNER_TEMP/pyto-command-frameworks.py" 2>&1 | tee output/frameworks.log

      - name: Build Python and scientific dependencies
        run: |
          set -o pipefail
          bash ./setup.sh 2>&1 | tee output/dependencies.log
          test -f python3_ios/Python3_ios/libPython3.10.a
          test -f Pods/Manifest.lock

      - name: Check required command frameworks
        run: |
          set -o pipefail
          python3 -u "$RUNNER_TEMP/pyto-command-frameworks.py" --check 2>&1 | tee -a output/frameworks.log

      - name: Build the iPhone app with VPP enabled
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Pyto.xcworkspace \
            -scheme Pyto \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PytoDerivedData" \
            -jobs 3 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            ENABLE_BITCODE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            'OTHER_SWIFT_FLAGS=$(inherited) -D VPP' \
            build 2>&1 | tee output/xcodebuild.log

      - name: Package IPA and preserve app entitlements
        run: |
          APP_PATH="$RUNNER_TEMP/PytoDerivedData/Build/Products/Release-iphoneos/Pyto.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/pyto-package/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/pyto-package/Payload/Pyto.app"
          python3 - <<'PY'
          import os
          import plistlib
          import subprocess
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE'])
          app = Path(os.environ['RUNNER_TEMP']) / 'pyto-package/Payload/Pyto.app'
          entitlement_files = {
              'Pyto.app': 'Pyto/Pyto.entitlements',
              'Pyto Intents.appex': 'Pyto Intents/Pyto Intents.entitlements',
              'Intents UI.appex': 'Intents UI/Intents UIDebug.entitlements',
              'WidgetExtension.appex': 'WidgetExtension.entitlements',
              'SwiftUI Preview.appex': 'SwiftUI Preview/SwiftUI Preview.entitlements',
              'SwiftUI Preview.app': 'SwiftUI Preview/SwiftUI Preview.entitlements',
          }
          # Ad-hoc signatures need no Apple account. They carry the original
          # entitlements into the IPA so TrollStore can preserve app groups.
          bundles = [p for p in app.rglob('*')
                     if not p.is_symlink() and
                     ((p.is_dir() and p.suffix in {'.framework', '.appex', '.app'})
                      or (p.is_file() and p.suffix == '.dylib'))]
          bundles.sort(key=lambda p: len(p.parts), reverse=True)
          for bundle in bundles + [app]:
              command = ['/usr/bin/codesign', '--force', '--sign', '-', '--timestamp=none']
              source = entitlement_files.get(bundle.name)
              if source:
                  entitlement = root / source
                  if not entitlement.is_file():
                      raise SystemExit(f'Missing entitlement file: {source}')
                  command += ['--entitlements', str(entitlement)]
              subprocess.run(command + [str(bundle)], check=True)
          subprocess.run(['/usr/bin/codesign', '--verify', '--deep', '--strict', str(app)], check=True)
          with (app / 'Info.plist').open('rb') as handle:
              info = plistlib.load(handle)
          print('App version:', info.get('CFBundleShortVersionString'))
          print('Minimum iOS:', info.get('MinimumOSVersion'))
          PY
          cd "$RUNNER_TEMP/pyto-package"
          /usr/bin/zip -q -r -y "$GITHUB_WORKSPACE/output/Pyto-TrollStore.ipa" Payload
          cd "$GITHUB_WORKSPACE/output"
          shasum -a 256 Pyto-TrollStore.ipa > Pyto-TrollStore.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Pyto-TrollStore
          path: |
            output/Pyto-TrollStore.ipa
            output/Pyto-TrollStore.sha256
            output/source-commit.txt
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Pyto-build-logs
          path: |
            output/*.log
            output/source-commit.txt
          retention-days: 3
          if-no-files-found: ignore
